<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>养生商城 · 图标预览</title>
  <style>
    :root {
      --icon-color: #B8BBB6;
      --compare-color: #2A3033;
      --color-bg: #F7F8F5;
      --color-card: #FFFFFF;
      --color-text: #2A3033;
      --color-muted: #8E918D;
      --color-border: #E5E6E2;
      --color-primary: #1C7231;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 28px 20px 56px;
    }

    main {
      width: min(960px, 100%);
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .subtitle {
      color: var(--color-muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 14px;
      min-width: min(360px, 100%);
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    label {
      color: var(--color-muted);
      font-size: 12px;
      min-width: 58px;
    }

    input[type="color"] {
      width: 36px;
      height: 36px;
      border: 0;
      background: transparent;
      padding: 0;
    }

    input[type="text"] {
      flex: 1;
      height: 36px;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      color: var(--color-text);
      font-size: 14px;
      padding: 0 10px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--color-primary);
    }

    button {
      height: 36px;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      background: var(--color-card);
      color: var(--color-text);
      cursor: pointer;
      font-size: 13px;
      padding: 0 12px;
      white-space: nowrap;
    }

    button.primary {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: #fff;
    }

    code {
      display: block;
      min-height: 36px;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      background: #FAFAF8;
      color: var(--color-text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.5;
      padding: 8px 10px;
      overflow-x: auto;
      white-space: nowrap;
    }

    h2 {
      color: var(--color-muted);
      font-size: 12px;
      font-weight: 500;
      margin: 28px 0 12px;
      text-transform: uppercase;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
      gap: 1px;
      overflow: hidden;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      background: var(--color-border);
    }

    .icon-tile {
      min-height: 112px;
      background: var(--color-card);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--icon-color);
      padding: 14px;
    }

    .icon-tile svg,
    .state svg,
    .tab-item svg {
      width: 24px;
      height: 24px;
    }

    .icon-tile span {
      color: var(--color-text);
      font-size: 13px;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 1px;
      overflow: hidden;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      background: var(--color-border);
    }

    .row {
      background: var(--color-card);
      display: flex;
      align-items: center;
      padding: 14px 16px;
      gap: 16px;
    }

    .label {
      flex: 1;
      font-size: 14px;
    }

    .states {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .state.file svg { color: var(--icon-color); }
    .state.compare svg { color: var(--compare-color); }

    .state span {
      color: var(--color-muted);
      font-size: 10px;
    }

    .tabbar-demo {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      display: flex;
      justify-content: space-around;
      padding: 12px 0 16px;
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      color: var(--icon-color);
      cursor: pointer;
      min-width: 56px;
    }

    .tab-item.active {
      color: var(--compare-color);
    }

    .tab-item span {
      font-size: 11px;
    }

    .status {
      color: var(--color-muted);
      font-size: 12px;
      min-height: 18px;
    }

    @media (max-width: 720px) {
      body { padding: 20px 14px 44px; }
      header { display: block; }
      .toolbar { margin-top: 18px; min-width: 0; }
      .row { align-items: flex-start; }
      .states { gap: 16px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Icon Preview</h1>
        <p class="subtitle">当前源文件颜色：<strong id="current-color">#B8BBB6</strong></p>
      </div>

      <div class="toolbar">
        <div class="control-row">
          <label for="icon-color">预览色</label>
          <input id="icon-color-picker" type="color" value="#B8BBB6">
          <input id="icon-color" type="text" value="#B8BBB6" spellcheck="false">
          <button class="primary" type="button" id="copy-command">复制命令</button>
        </div>
        <code id="command">node scripts/set-icon-color.js B8BBB6</code>
        <p class="status" id="status"></p>
      </div>
    </header>

    <h2>All Icons</h2>
    <div class="grid" id="icon-grid"></div>

    <h2>Order Status</h2>
    <div class="list" id="order-list"></div>

    <h2>Menu</h2>
    <div class="list" id="menu-list"></div>

    <h2>Navigation</h2>
    <div class="tabbar-demo" id="tabbar"></div>
  </main>

  <div id="svg-sprite" style="display:none"></div>

  <script>
    const fallbackColor = '#B8BBB6';
    const root = document.documentElement;
    const colorText = document.getElementById('icon-color');
    const colorPicker = document.getElementById('icon-color-picker');
    const currentColor = document.getElementById('current-color');
    const command = document.getElementById('command');
    const status = document.getElementById('status');

    const groups = {
      order: [
        ['payment', '待付款'],
        ['delivery', '待收货'],
        ['review', '待评价'],
        ['refund', '退款/售后']
      ],
      menu: [
        ['history', '浏览历史'],
        ['member', '会员中心'],
        ['coupon', '领券中心'],
        ['address', '地址管理'],
        ['distribution', '分销中心'],
        ['service', '联系客服'],
        ['favorites', '我的收藏'],
        ['faq', '常见问题'],
        ['settings', '设置'],
        ['lang', '语言'],
        ['about', '关于我们'],
        ['edit', '编辑'],
        ['search', '搜索'],
        ['chevron', '箭头']
      ],
      nav: [
        ['home', '首页'],
        ['grid', '分类'],
        ['cart', '购物车'],
        ['user', '我的']
      ]
    };

    const allIcons = [...groups.order, ...groups.menu, ...groups.nav];

    function normalizeHex(value) {
      const raw = value.trim().replace(/^#/, '');
      return /^[0-9a-fA-F]{6}$/.test(raw) ? `#${raw.toUpperCase()}` : '';
    }

    function commandFor(color) {
      return `node scripts/set-icon-color.js ${color.replace('#', '')}`;
    }

    function setPreviewColor(value) {
      const color = normalizeHex(value);
      if (!color) {
        status.textContent = '请输入 6 位十六进制颜色';
        return;
      }
      status.textContent = '';
      root.style.setProperty('--icon-color', color);
      colorText.value = color;
      colorPicker.value = color;
      currentColor.textContent = color;
      command.textContent = commandFor(color);
    }

    function iconSvg(name) {
      return `<svg aria-hidden="true"><use href="#icon-${name}"></use></svg>`;
    }

    function renderGrid() {
      document.getElementById('icon-grid').innerHTML = allIcons
        .map(([name, label]) => `<div class="icon-tile">${iconSvg(name)}<span>${label}</span></div>`)
        .join('');
    }

    function renderRows(target, rows) {
      document.getElementById(target).innerHTML = rows
        .map(([name, label]) => `
          <div class="row">
            <span class="label">${label}</span>
            <div class="states">
              <div class="state file">${iconSvg(name)}<span>文件色</span></div>
              <div class="state compare">${iconSvg(name)}<span>对比色</span></div>
            </div>
          </div>
        `)
        .join('');
    }

    function renderTabbar() {
      document.getElementById('tabbar').innerHTML = groups.nav
        .map(([name, label], index) => `
          <div class="tab-item ${index === 0 ? 'active' : ''}" onclick="setTab(this)">
            ${iconSvg(name)}
            <span>${label}</span>
          </div>
        `)
        .join('');
    }

    function setTab(el) {
      document.querySelectorAll('.tab-item').forEach(item => item.classList.remove('active'));
      el.classList.add('active');
    }

    function makePreviewSprite(svg) {
      return svg
        .replace(/\b(stroke|fill)="(?!none\b|transparent\b|url\()[^"]+"/gi, '$1="currentColor"')
        .replace(/\b(stroke|fill):\s*(?!none\b|transparent\b|url\()[^;"']+/gi, '$1: currentColor');
    }

    function detectSpriteColor(svg) {
      const match = svg.match(/\b(?:stroke|fill)="(#[0-9a-fA-F]{6})"/);
      return match ? normalizeHex(match[1]) : '';
    }

    colorText.addEventListener('input', event => setPreviewColor(event.target.value));
    colorPicker.addEventListener('input', event => setPreviewColor(event.target.value));

    document.getElementById('copy-command').addEventListener('click', async () => {
      const text = command.textContent;
      try {
        await navigator.clipboard.writeText(text);
        status.textContent = '命令已复制';
      } catch (error) {
        status.textContent = text;
      }
    });

    fetch('icons-sprite.svg')
      .then(response => response.text())
      .then(svg => {
        const actualColor = detectSpriteColor(svg) || fallbackColor;
        document.getElementById('svg-sprite').innerHTML = makePreviewSprite(svg);
        renderGrid();
        renderRows('order-list', groups.order);
        renderRows('menu-list', groups.menu);
        renderTabbar();
        setPreviewColor(actualColor);
      })
      .catch(() => {
        status.textContent = '无法读取 icons-sprite.svg，请通过本地服务打开预览页';
      });
  </script>
</body>
</html>
