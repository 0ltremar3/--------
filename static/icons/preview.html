<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>养生商城 · 图标预览</title>
  <style>
    :root {
      --color-active: #61A189;
      --color-inactive: #a8a49e;
      --color-bg: #f5f3ef;
      --color-card: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--color-bg);
      font-family: -apple-system, "PingFang SC", sans-serif;
      padding: 40px 24px 60px;
    }
    h1 {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #aaa;
      margin-bottom: 36px;
    }
    h2 {
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #bbb;
      margin: 40px 0 16px;
      border-bottom: 1px solid #e0ddd8;
      padding-bottom: 8px;
    }

    /* ── 双状态对比列表 ── */
    .list { display: flex; flex-direction: column; gap: 1px; }
    .row {
      background: var(--color-card);
      display: flex;
      align-items: center;
      padding: 14px 16px;
      gap: 16px;
    }
    .row:first-child { border-radius: 6px 6px 0 0; }
    .row:last-child  { border-radius: 0 0 6px 6px; }
    .row .label {
      flex: 1;
      font-size: 13px;
      color: #333;
    }
    .row .states {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .state svg {
      width: 24px;
      height: 24px;
    }
    .state.inactive svg { color: var(--color-inactive); }
    .state.active   svg { color: var(--color-active); }
    .state span {
      font-size: 9px;
      letter-spacing: 0.06em;
    }
    .state.inactive span { color: var(--color-inactive); }
    .state.active   span { color: var(--color-active); }

    /* ── 底部导航模拟 ── */
    .tabbar-demo {
      background: #fff;
      border-radius: 6px;
      display: flex;
      justify-content: space-around;
      padding: 12px 0 16px;
      margin-top: 8px;
      box-shadow: 0 -1px 0 #eee;
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .tab-item svg { width: 24px; height: 24px; }
    .tab-item span { font-size: 10px; }
    .tab-item.inactive svg,
    .tab-item.inactive span { color: var(--color-inactive); }
    .tab-item.active svg,
    .tab-item.active span { color: var(--color-active); }

    /* ── 色板说明 ── */
    .swatch-row {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }
    .swatch {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #666;
    }
    .swatch-dot {
      width: 14px; height: 14px;
      border-radius: 50%;
    }
  </style>
</head>
<body>

  <h1>山前食养 · Icon System — Active / Inactive</h1>

  <div class="swatch-row">
    <div class="swatch">
      <div class="swatch-dot" style="background:#f86c8a"></div>
      激活色 #f86c8a
    </div>
    <div class="swatch">
      <div class="swatch-dot" style="background:#8a8a8a"></div>
      未激活 #8a8a8a
    </div>
  </div>

  <h2>Order Status · 订单状态</h2>
  <div class="list">
    <div class="row"><span class="label">待付款</span><div class="states">
      <div class="state inactive"><svg><use href="#icon-payment"/></svg><span>未激活</span></div>
      <div class="state active"><svg><use href="#icon-payment"/></svg><span>激活</span></div>
    </div></div>
    <div class="row"><span class="label">待收货</span><div class="states">
      <div class="state inactive"><svg><use href="#icon-delivery"/></svg><span>未激活</span></div>
      <div class="state active"><svg><use href="#icon-delivery"/></svg><span>激活</span></div>
    </div></div>
    <div class="row"><span class="label">待评价</span><div class="states">
      <div class="state inactive"><svg><use href="#icon-review"/></svg><span>未激活</span></div>
      <div class="state active"><svg><use href="#icon-review"/></svg><span>激活</span></div>
    </div></div>
    <div class="row"><span class="label">退款/售后</span><div class="states">
      <div class="state inactive"><svg><use href="#icon-refund"/></svg><span>未激活</span></div>
      <div class="state active"><svg><use href="#icon-refund"/></svg><span>激活</span></div>
    </div></div>
  </div>

  <h2>Menu · 菜单列表</h2>
  <div class="list">
    <div class="row"><span class="label">浏览历史</span><div class="states">
      <div class="state inactive"><svg><use href="#icon-history"/></svg><span>未激活</span></div>
      <div class="state active"><svg><use href="#icon-history"/></svg><span>激活</span></div>
    </div></div>
    <div class="row"><span class="label">会员中心</span><div class="states">
      <div class="state inactive"><svg><use href="#icon-member"/></svg><span>未激活</span></div>
      <div class="state active"><svg><use href="#icon-member"/></svg><span>激活</span></div>
    </div></div>
    <div class="row"><span class="label">领券中心</span><div class="states">
      <div class="state inactive"><svg><use href="#icon-coupon"/></svg><span>未激活</span></div>
      <div class="state active"><svg><use href="#icon-coupon"/></svg><span>激活</span></div>
    </div></div>
    <div class="row"><span class="label">地址管理</span><div class="states">
      <div class="state inactive"><svg><use href="#icon-address"/></svg><span>未激活</span></div>
      <div class="state active"><svg><use href="#icon-address"/></svg><span>激活</span></div>
    </div></div>
    <div class="row"><span class="label">分销中心</span><div class="states">
      <div class="state inactive"><svg><use href="#icon-distribution"/></svg><span>未激活</span></div>
      <div class="state active"><svg><use href="#icon-distribution"/></svg><span>激活</span></div>
    </div></div>
    <div class="row"><span class="label">联系客服</span><div class="states">
      <div class="state inactive"><svg><use href="#icon-service"/></svg><span>未激活</span></div>
      <div class="state active"><svg><use href="#icon-service"/></svg><span>激活</span></div>
    </div></div>
    <div class="row"><span class="label">我的收藏</span><div class="states">
      <div class="state inactive"><svg><use href="#icon-favorites"/></svg><span>未激活</span></div>
      <div class="state active"><svg><use href="#icon-favorites"/></svg><span>激活</span></div>
    </div></div>
    <div class="row"><span class="label">常见问题</span><div class="states">
      <div class="state inactive"><svg><use href="#icon-faq"/></svg><span>未激活</span></div>
      <div class="state active"><svg><use href="#icon-faq"/></svg><span>激活</span></div>
    </div></div>
    <div class="row"><span class="label">设置</span><div class="states">
      <div class="state inactive"><svg><use href="#icon-settings"/></svg><span>未激活</span></div>
      <div class="state active"><svg><use href="#icon-settings"/></svg><span>激活</span></div>
    </div></div>
  </div>

  <h2>Navigation · 底部导航（点击切换）</h2>
  <div class="tabbar-demo">
    <div class="tab-item active"   onclick="setTab(this)"><svg><use href="#icon-home"/></svg><span>首页</span></div>
    <div class="tab-item inactive" onclick="setTab(this)"><svg><use href="#icon-grid"/></svg><span>分类</span></div>
    <div class="tab-item inactive" onclick="setTab(this)"><svg><use href="#icon-cart"/></svg><span>购物车</span></div>
    <div class="tab-item inactive" onclick="setTab(this)"><svg><use href="#icon-user"/></svg><span>我的</span></div>
  </div>

  <div id="svg-sprite" style="display:none"></div>
  <script>
    fetch('icons-sprite.svg')
      .then(r => r.text())
      .then(html => { document.getElementById('svg-sprite').innerHTML = html; });

    function setTab(el) {
      document.querySelectorAll('.tab-item').forEach(t => {
        t.className = 'tab-item inactive';
      });
      el.className = 'tab-item active';
    }
  </script>
</body>
</html>
